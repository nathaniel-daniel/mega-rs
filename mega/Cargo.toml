[package]
name = "mega"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
block-padding = "0.4.2"
cbc = "0.2.1"
ctr = "0.10.1"
ecb = "0.2.1"
itoa = "1.0.18"
pin-project-lite = "0.2.17"
rand = { version = "0.10.3", features = [ "std", "std_rng", "thread_rng" ], default-features = false }
reqwest = { version = "0.13.5", features = [ "http2", "json", "stream" ], default-features = false }
rustls = { version = "0.23.46", default-features = false, optional = true }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = [ "time" ] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
url = { version = "2.5.8", features = [ "serde" ] }

[dev-dependencies]
tokio = { version = "1.53.3", features = [ "macros", "fs" ] }

[features]
default = [ "native-tls", "system-proxy" ]
native-tls = [ "reqwest/native-tls" ]
rustls = [ "reqwest/rustls" ]
rustls-ring = [ "reqwest/rustls-no-provider", "rustls/ring" ]
system-proxy = [ "reqwest/system-proxy" ]
easy = [ "tokio/sync" ]
