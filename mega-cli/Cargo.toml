[package]
name = "mega-cli"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
indicatif = { version = "0.18.6", features = [ "tokio" ] }
mega = { version = "0.0.0", path = "../mega", features = [ "easy" ], default-features = false }
nd-util = { git = "https://github.com/nathaniel-daniel/nd-util-rs", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = [ "rt-multi-thread", "fs" ] }

[features]
default = [ "rustls" ]
native-tls = [ "mega/native-tls" ]
rustls = [ "mega/rustls" ]
